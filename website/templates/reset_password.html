{% extends "base.html" %}

{% block title %}Смена пароля{% endblock %}

{% block content %}
<div class="container mt-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0" style="border-radius: 16px; background: rgba(15, 26, 58, 0.85); backdrop-filter: blur(8px);">
                <div class="card-body p-5 text-white">
                    <h3 class="text-center mb-4 fw-bold">Смена пароля</h3>

                    <form method="POST">
                        <div class="mb-4">
                            <label for="password" class="form-label fw-medium">Новый пароль</label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Введите новый пароль" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="password2" class="form-label fw-medium">Повторите пароль</label>
                            <input type="password" class="form-control form-control-lg" id="password2" name="password2" placeholder="Повторите новый пароль" required>
                        </div>

                        <button type="submit" class="btn btn-lg w-100 fw-bold btn-login-custom mt-3" style="background: linear-gradient(90deg, #d4a373, #e8c39e); border: none; color: #0b132b;">
                            Сменить пароль
                        </button>
                    </form>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category == 'error' else category }} mt-3 text-dark">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
